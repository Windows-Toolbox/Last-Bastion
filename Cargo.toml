[package]
name = "last_bastion"
version = "0.1.0"
edition = "2024"
# Two programs from one library (`src\lib.rs`): the game (`src\main.rs`) and the map editor (`src\bin\editor.rs`,
# Cargo finds everything in `src\bin\` by itself). `cargo run` starts the game, `cargo run --bin editor` the editor.
default-run = "last_bastion"

[dependencies]
# egui (a whole toolbox of fields, lists and panels) drawn by macroquad – the map editor's panel (`src\editor.rs`).
# The game doesn't show it (yet, DESIGN.md 12.6).
egui-macroquad = "0.17.3"
libm = "0.2.16"
macroquad = "0.4.16"
# The zombies think side by side on all cores (`src\sim\zombies.rs`) – every one comes out as if worked out alone.
rayon = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

# The debug build (`cargo run`) a bit optimized, the libraries fully: without it, one command (a flow field over the
# whole map) took ~20 ms there – a visible hitch. Still quick to build, and overflow checks stay on.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

# `.\build.ps1` builds release. Incremental like the debug build: after a small change only what changed is compiled
# again – ~4 s instead of ~30 s. The exe may be a few percent slower; the numbers stay the same (no fast-math).
[profile.release]
incremental = true

# Only for `examples\` (not built into the game): `test_sprites` writes a PNG. The same `image` that macroquad already
# uses for loading pictures, so nothing new gets downloaded.
[dev-dependencies]
image = { version = "0.24", default-features = false, features = ["png"] }
